name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run package

      - name: Run Tests
        run: xvfb-run -a npm run test

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package Extension
        run: npx -y @vscode/vsce package --out ssh-relay-guard-${{ steps.version.outputs.VERSION }}.vsix

      - name: Publish to VS Code Marketplace
        run: npx -y @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true

      - name: Publish to Open VSX Registry (Antigravity)
        run: npx -y ovsx publish -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SSH Relay Guard ${{ github.ref_name }}
          draft: false
          files: ssh-relay-guard-${{ steps.version.outputs.VERSION }}.vsix
          generate_release_notes: true
